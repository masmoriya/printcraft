# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    name: FreeBSD 14 (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: "14.3"
          usesh: true
          cpu: 4
          mem: 12288
          # Nothing to bring back; copying the target dir out of the VM fails on large builds.
          copyback: false
          prepare: |
            pkg install -y bash git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
            rustup_dir="$(mktemp -d "${TMPDIR:-/tmp}/rustup.XXXXXXXX")" || exit 1
            rustup_init="$rustup_dir/rustup-init"
            trap 'rm -f "$rustup_init"; rmdir "$rustup_dir"' 0
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL -o "$rustup_init" \
              'https://static.rust-lang.org/rustup/archive/1.29.3/x86_64-unknown-freebsd/rustup-init' || exit 1
            if [ "$(sha256 -q "$rustup_init")" != '6c2fd1ace77dae186d34ad7b59d848d37d48f447cfc02c60c211e3503dc789cf' ]; then
              printf '%s\n' 'Rustup installer checksum mismatch.' >&2
              exit 1
            fi
            chmod 0700 "$rustup_init" || exit 1
            "$rustup_init" -y --profile minimal
          run: |
            . "$HOME/.cargo/env"
            # The checkout is synced in under another owner; let tests that call git read it.
            git config --global --add safe.directory "*"
            rustc --version
            CARGO_PROFILE_DEV_DEBUG=0 cargo build --workspace --all-targets --locked
            CARGO_PROFILE_DEV_DEBUG=0 cargo test --workspace --locked
            # The release packaging, end to end (a quicker release profile than the real release).
            CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 packaging/freebsd/package.sh
            tar -tzf dist/release/printcraft-*-freebsd-*.tar.gz | grep -E '/bin/printcraft$|/bin/printcraft-cli$|applications/'
